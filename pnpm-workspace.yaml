packages:
  - apps/*
  - packages/*

# Make `pnpm install` fail when the Node version does not satisfy `engines`.
engineStrict: true

# Install scripts: better-sqlite3 (prebuilt binary or node-gyp) and @prisma/engines (downloads the
# schema engine binary used by the migrate commands). prisma only checks the Node version in its
# preinstall hook, which the CLI repeats on every start, so it stays denied.
allowBuilds:
  better-sqlite3: true
  '@prisma/engines': true
  prisma: false

minimumReleaseAgeExclude:
  - '@typescript-eslint/eslint-plugin@8.71.2'
  - '@typescript-eslint/parser@8.71.2'
  - '@typescript-eslint/project-service@8.71.2'
  - '@typescript-eslint/scope-manager@8.71.2'
  - '@typescript-eslint/tsconfig-utils@8.71.2'
  - '@typescript-eslint/type-utils@8.71.2'
  - '@typescript-eslint/types@8.71.2'
  - '@typescript-eslint/typescript-estree@8.71.2'
  - '@typescript-eslint/utils@8.71.2'
  - '@typescript-eslint/visitor-keys@8.71.2'
  - typescript-eslint@8.71.2
  - zod@4.6.7
