      - "1a: typical catalog hundreds to low thousands; synchronous validation"
      - "2a: SKU optional; blank warns; duplicate in the same product blocks; across products warns"
      - "3a: one stock location per variant row"
      - "4a: template ships two EJEMPLO- products with a non-blocking warning plus an instructions sheet"
      - "5a: image orden required positive integer; lowest is the cover; blank blocks"
      - "6a: gestionar_inventario accepts true/false, verdadero/falso, si/sí/no, 1/0 and native booleans; blank blocks when stock is present, otherwise false"
      - "7a: sheet names and headers matched trimmed, case-folded and accent-insensitive (accepts Imágenes)"
      - "8a: S1 owns the pure image path syntax check reused by S3"
      - "9a: message codes and params in contracts with a shared Spanish catalog"
      - "10a: at most 4 decimals, magnitude below 1e12, zero price warns, negative blocks (store currency scale is tier B)"
      - "11a: numeric cell in sku or codigo_barras warns up to 15 digits; blocks from 16 digits or exponent form"
      - "library choice is settled by the U3 spike among SheetJS CE 0.20.3, modern-xlsx and an own reader"
