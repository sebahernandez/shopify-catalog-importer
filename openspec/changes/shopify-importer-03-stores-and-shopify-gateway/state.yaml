      - "Q7: required scope set is a constant in contracts: write_products, write_files, write_inventory, and locations by any of three scopes; the scope for stagedUploadsCreate stays unverified"
      - "Q8: timeouts, retries and caps are constants in code (15 s, 3 attempts, 2 MB, 250 locations), not environment variables"
      - "Q9: locations are returned live and not persisted; only a count is stored"
      - "Q10: a stored version that differs from the config version is re-verified on demand"
      - "Q11: one stores module with the gateway ports inside"
      - "Q12: the live smoke test against a real development store belongs to S7 unless a development store is available during S2"
