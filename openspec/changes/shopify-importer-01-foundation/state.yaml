    questions:
      - id: Q1
        text: On Admin GraphQL API 2026-10, what is the exact barcode/barcodes input shape for product variants, and which breaking changes or deprecations between 2026-07 and 2026-10 affect productSet, stagedUploadsCreate, fileCreate, productReorderMedia, productVariantAppendMedia, inventorySetQuantities, inventoryActivate, locations, productByIdentifier and metafield definitions?
      - id: Q2
        text: Which access scopes are required on 2026-10 for locations, file status reads, inventory reads, the shop query, and creating a metafield definition with the unique-values capability?
      - id: Q3
        text: For stagedUploadsCreate with resource IMAGE, which httpMethod applies, how must the upload request be built from the returned parameters, and how long is the staged target valid?
      - id: Q4
        text: With productSet on 2026-10, what payload creates a simple product with a single default variant, and what happens when a supplied handle is already taken?
      - id: Q5
        text: What are the current stable versions and mutual compatibility constraints of Node.js LTS, pnpm, NestJS, Prisma with SQLite, Vite, React, Tailwind CSS, Vitest, Playwright, Sharp and SheetJS CE, as needed to scaffold the workspace?
      - id: Q6
        text: How does the Admin GraphQL API signal throttling (HTTP status and error code), and what is the current daily variant-creation limit?
    admission: granted
    outcome: done
    scoped_to: [Q1 (barcode input shape only), Q5]
    scope_basis: User decision on 2026-10-13 to limit research to what S0 needs; former Q2, Q3, Q4, Q6 deferred to later changes.
    deferred_unsupported: [U1, U2, U3, U4, U5, U6, U7, U8]
