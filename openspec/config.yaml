schema: spec-driven

context: |
  Project: shopify-catalog-importer (greenfield; only the master prompt shopify-catalog-importer-prompt.md exists).
  Product: local app that imports a product catalog from XLSX into Shopify (backend-only Shopify calls, resumable, duplicate-safe).
  Planned stack (PLANNED, not installed; source: prompt section 3): TypeScript strict, React + Vite, NestJS, Tailwind CSS, SQLite + Prisma, Sharp, XLSX library, Vitest or Jest, Playwright, pnpm.
  Constraints: no Redis/Docker by default; Shopify tokens never exposed to the frontend; never claim verification against a real store without a real connection.
  Testing: Vitest wired at the workspace root since S0 work unit U1; run with `pnpm test` on Node 24 (pnpm 12 via corepack).
  Git repository on branch main with remote origin (initialized after sdd-init, on 2026-10-13).

strict_tdd: true

testing:
  strict_tdd: true
  reason: "Enabled by the user on 2026-10-13 after S0 work unit U2: Vitest runs at the workspace root via pnpm test, and the ESM, DI and native-module spikes passed."
  detected: true
  planned:
    unit: "Vitest or Jest (to be decided at scaffold time)"
    e2e: "Playwright"
    package_manager: "pnpm"
  test_command: "pnpm test"
  coverage_command: ""

projects: []

rules:
  proposal:
    - Include rollback plan for risky changes
    - Write artifacts in English; the source prompt is in Spanish
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
    - Keep frontend, backend, and shared contracts clearly separated
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
    - Forecast review workload against the 400 changed-line budget
  apply:
    guidelines:
      - Follow existing code patterns once scaffolded
      - Never add mandatory services (Redis, Docker) without a justified need
    tdd: true
    test_command: "pnpm test"
  verify:
    test_command: "pnpm test"
    build_command: "pnpm build"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas

session:
  execution_mode: interactive
  artifact_store: openspec
  delivery_strategy: ask-on-risk
  review_budget_lines: 400
